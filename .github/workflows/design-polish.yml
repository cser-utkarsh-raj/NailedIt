name: Design Polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    if: ${{ !startsWith(github.event.head_commit.message, 'design: polish') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply visual refinements
        shell: python
        run: |
          from pathlib import Path
          import re

          def edit(path, fn):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              n = fn(s)
              if n == s:
                  print(f'No change: {path}')
              else:
                  p.write_text(n, encoding='utf-8')
                  print(f'Updated: {path}')

          # Theme picker: Corporate must visually read as a light corporate palette.
          edit('src/components/ThumbnailStudioView.tsx', lambda s: s.replace(
              "{ id: 'corporate', label: 'Corporate', desc: 'Classic Royal Blue', color: 'from-slate-900 via-blue-600 to-sky-400', dotColor: '#2563EB', border: 'border-blue-500' },",
              "{ id: 'corporate', label: 'Corporate', desc: 'White, Slate & Royal Blue', color: 'from-white via-slate-100 to-blue-600', dotColor: '#2563EB', border: 'border-blue-500' },"
          ))

          # Elegant: remove the oversized competing aura-orb composition and replace it with
          # a restrained editorial wash that preserves the palette and typography.
          def ethereal(s):
              pattern = re.compile(r"  // Aura Orbs\n.*?  // Hairline Delicate Arch/Frame border", re.S)
              replacement = '''  // Restrained editorial atmosphere: soft tonal depth, never a dominant shape.\n  const wash = ctx.createLinearGradient(\n    0,\n    0,\n    isPortrait ? width : width * 0.75,\n    height\n  );\n  wash.addColorStop(0, palette.bg);\n  wash.addColorStop(0.52, palette.bg);\n  wash.addColorStop(1, palette.orb1);\n  ctx.globalAlpha = 0.16;\n  ctx.fillStyle = wash;\n  ctx.fillRect(0, 0, width, height);\n  ctx.globalAlpha = 1;\n\n  // Hairline Delicate Arch/Frame border'''
              n, count = pattern.subn(replacement, s, count=1)
              return n
          edit('src/components/canvas/ethereal.ts', ethereal)

          # Minimalistic: remove decorative crosshair clutter; retain one precise Swiss-style rule.
          def minimal(s):
              pattern = re.compile(r"  // Color Swatch Accent Indicator\n.*?  // 3\. LAYOUT REGIONS", re.S)
              replacement = '''  // Single restrained accent rule — no decorative crosshair clutter.\n  ctx.fillStyle = palette.accent;\n  ctx.fillRect(padX, topY - 3, Math.min(42, width * 0.06), 3);\n\n  // 3. LAYOUT REGIONS'''
              n, count = pattern.subn(replacement, s, count=1)
              return n
          edit('src/components/canvas/minimalistic.ts', minimal)

          # Tech: Corporate becomes genuinely light and business-oriented instead of another dark blue theme.
          def tech(s):
              return s.replace(
                  "corporate: { primary: '#38BDF8', glow: 'rgba(56, 189, 248, 0.30)', bg: '#0C1B33' },",
                  "corporate: { primary: '#1D4ED8', glow: 'rgba(37, 99, 235, 0.14)', bg: '#F8FAFC' },"
              ).replace(
                  "ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';",
                  "ctx.fillStyle = accentScheme.bg === '#F8FAFC' ? 'rgba(15, 23, 42, 0.055)' : 'rgba(255, 255, 255, 0.04)';"
              ).replace(
                  "ctx.fillStyle = 'rgba(15, 23, 42, 0.65)';",
                  "ctx.fillStyle = accentScheme.bg === '#F8FAFC' ? 'rgba(255, 255, 255, 0.92)' : 'rgba(15, 23, 42, 0.65)';"
              )
          edit('src/components/canvas/techSaas.ts', tech)

          # Corporate palette in YouTube Bold becomes a clean white/royal-blue creator variant,
          # while the Creator composition itself remains untouched.
          def creator(s):
              return s.replace(
                  "corporate: { bg: '#0B1120', text: '#FFFFFF', accent: '#38BDF8', blockText: '#000000', glow: '#2563EB' },",
                  "corporate: { bg: '#F8FAFC', text: '#0F172A', accent: '#1D4ED8', blockText: '#FFFFFF', glow: '#93C5FD' },"
              )
          edit('src/components/canvas/youtubeBold.ts', creator)

          # Bohemian: turn keyword badges into quiet editorial labels rather than UI pills.
          def boho(s):
              return s.replace(
                  "ctx.strokeRect(px, py - 18 * tScale, m.width + 20 * tScale, 36 * tScale);",
                  "ctx.beginPath(); ctx.moveTo(px, py + 18 * tScale); ctx.lineTo(px + m.width + 20 * tScale, py + 18 * tScale); ctx.stroke();"
              )
          edit('src/components/canvas/bohemian.ts', boho)

      - name: Commit and clean up
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ThumbnailStudioView.tsx src/components/canvas/*.ts
          git rm .github/workflows/design-polish.yml
          git commit -m "design: polish themes and template compositions" || exit 0
          git push