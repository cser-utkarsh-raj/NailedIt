name: Tags Polish

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update tags UI
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/components/ThumbnailStudioView.tsx')
          s = p.read_text(encoding='utf-8')

          old = '''  const handleAdd = (e: React.KeyboardEvent<HTMLInputElement>) => {
    if (e.key === 'Enter' && inputValue.trim()) {
      e.preventDefault();
      const newPills = [...pills, inputValue.trim()];
      onUpdatePost({ keyPills: newPills.join(' • ') });
      setInputValue('');
    }
  };'''
          new = '''  const handleAdd = () => {
    const textToAdd = inputValue.trim();
    if (textToAdd && pills.length < 4) {
      const newPills = [...pills, textToAdd];
      onUpdatePost({ keyPills: newPills.join(' • ') });
      setInputValue('');
    }
  };

  const handleKeyDown = (e: React.KeyboardEvent<HTMLInputElement>) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      handleAdd();
    }
  };'''
          assert old in s, 'Tag add handler not found'
          s = s.replace(old, new, 1)

          old = '''          Tags & Keyword Badges
        </label>
        <label className="flex items-center gap-1.5 text-xs text-slate-600 font-medium cursor-pointer">'''
          new = '''          Tags
        </label>
        <div className="flex items-center gap-3">
          <span className="text-[10px] text-slate-400 font-medium">{pills.length}/4</span>
          <label className="flex items-center gap-1.5 text-xs text-slate-600 font-medium cursor-pointer">'''
          assert old in s, 'Tag heading not found'
          s = s.replace(old, new, 1)

          old = '''          <input
            type="checkbox"
            checked={post.showKeyPills}
            onChange={(e) => onUpdatePost({ showKeyPills: e.target.checked })}
            className="w-3.5 h-3.5 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500"
          />
          Show
        </label>
      </div>'''
          new = '''          <input
            type="checkbox"
            checked={post.showKeyPills}
            onChange={(e) => onUpdatePost({ showKeyPills: e.target.checked })}
            className="w-3.5 h-3.5 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500"
          />
          Show
          </label>
        </div>
      </div>'''
          assert old in s, 'Tag controls not found'
          s = s.replace(old, new, 1)

          old = '''      <input
        type="text"
        placeholder="Type tag & press Enter..."
        value={inputValue}
        onChange={(e) => setInputValue(e.target.value)}
        onKeyDown={handleAdd}
        className="w-full text-xs rounded-lg border border-slate-200 bg-slate-50/50 px-3 py-2 text-slate-900 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition shadow-2xs"
      />'''
          new = '''      {pills.length < 4 && (
        <div className="flex gap-2">
          <input
            type="text"
            placeholder="Type a tag..."
            value={inputValue}
            onChange={(e) => setInputValue(e.target.value)}
            onKeyDown={handleKeyDown}
            className="flex-1 text-xs rounded-lg border border-slate-200 bg-slate-50/50 px-3 py-2 text-slate-900 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition shadow-2xs"
          />
          <button
            type="button"
            onClick={handleAdd}
            disabled={!inputValue.trim()}
            className="px-3 py-2 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed text-white text-xs font-semibold rounded-lg transition-colors shadow-2xs flex items-center gap-1 shrink-0 cursor-pointer"
          >
            <Plus className="w-3.5 h-3.5" />
            Add
          </button>
        </div>
      )}'''
          assert old in s, 'Tag input not found'
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "UtkarshRaj"
          git config user.email "cser.utkarsh.raj@gmail.com"
          git add src/components/ThumbnailStudioView.tsx
          git commit -m "feat: improve tags input" || exit 0
          git push

      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/tags-polish.yml
          git commit -m "chore: remove temporary tags workflow" || exit 0
          git push
